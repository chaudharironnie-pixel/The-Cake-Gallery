<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450">
  <rect width="600" height="450" fill="#FDE8E0" rx="12"/>
  <g transform="translate(300,200)" text-anchor="middle">
    <!-- Cake base -->
    <rect x="-100" y="20" width="200" height="60" rx="8" fill="#D4956B" opacity="0.8"/>
    <rect x="-80" y="-30" width="160" height="55" rx="8" fill="#C47A5A" opacity="0.85"/>
    <rect x="-65" y="-75" width="130" height="50" rx="8" fill="#B56B4E" opacity="0.9"/>
    <!-- Frosting drips -->
    <ellipse cx="-50" cy="-75" rx="12" ry="8" fill="#FDE8E0"/>
    <ellipse cx="0" cy="-78" rx="15" ry="10" fill="#FDE8E0"/>
    <ellipse cx="50" cy="-75" rx="12" ry="8" fill="#FDE8E0"/>
    <!-- Cherry on top -->
    <circle cx="0" cy="-95" r="10" fill="#D94F4F" opacity="0.9"/>
    <line x1="0" y1="-105" x2="3" y2="-118" stroke="#5A7A3A" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="6" cy="-118" rx="5" ry="3" fill="#6B8C42" opacity="0.8" transform="rotate(-20 6 -118)"/>
    <!-- Text -->
    <text y="120" font-family="Georgia, serif" font-size="18" fill="#8B5E3C" opacity="0.7">蛋糕</text>
    <text y="145" font-family="Georgia, serif" font-size="13" fill="#8B5E3C" opacity="0.5">Image Loading...</text>
  </g>
</svg>
